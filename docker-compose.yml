services:
  postgres:
    image: postgres:18-alpine
    container_name: crud-learning-postgres
    environment:
      POSTGRES_DB: crud_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Postgres cai san tren may dang giu 5432 -> container map ra 5433.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crud_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
